#:schema ../schema/recipe.schema.json
schema = "unienv/recipe/v0"
id = "speech"
summary = "Transcribe audio and video locally with faster-whisper and ffmpeg (opt-in)"
default = false
maintainers = ["github:rupeshbharambe24", "github:KunjMaheshwari"]
license_note = "faster-whisper MIT; CTranslate2 MIT; ffmpeg LGPL/GPL"

[python]
packages = ["faster-whisper"]
imports = ["faster_whisper"]

[system.macos]
brew = ["ffmpeg"]

[system.debian]
apt = ["ffmpeg"]

[verify]
bins = ["ffmpeg"]

[agent]
notes = """
- Local audio/video transcription via `ue-py` with `faster-whisper` (CTranslate2 backend, no PyTorch required).
- Default to the `small` model with `compute_type="int8"` on CPU, and share the model cache under `~/.unienv/cache/hf`:
  `import os; from faster_whisper import WhisperModel; model = WhisperModel("small", device="cpu", compute_type="int8", download_root=os.path.expanduser("~/.unienv/cache/hf"))`
- Extract or normalize audio before transcription when needed with `ffmpeg -i input.mp4 -vn -ac 1 -ar 16000 audio.wav`.
"""
