name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches version strings
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "src")
          import unienv, unienv_mcp
          manifest = json.loads(open("mcpb/manifest.json").read())
          versions = {
              "src/unienv.py:VERSION": f"v{unienv.VERSION}",
              "src/unienv_mcp.py:SERVER_VERSION": f"v{unienv_mcp.SERVER_VERSION}",
              "mcpb/manifest.json:version": f"v{manifest['version']}",
              ".devcontainer/unienv/devcontainer-feature.json:version": f"v{json.loads(open('.devcontainer/unienv/devcontainer-feature.json').read())['version']}",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          mismatches = {k: v for k, v in versions.items() if v != tag}
          if mismatches:
              raise SystemExit(f"Tag {tag!r} does not match hardcoded versions: {mismatches}")
          print(f"Verified all versions match tag {tag}")
          PY
      - name: Run unit tests
        run: python3 -m unittest discover -s tests/unit -v
      - name: Build the Claude Desktop Extension
        run: |
          scripts/build-mcpb.sh
          npx -y @anthropic-ai/mcpb validate mcpb/manifest.json
      - name: Generate release tarball and SHA256SUMS
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="unienv-ai-${GITHUB_REF_NAME}/" -o "dist/unienv-ai-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum "unienv-ai-${GITHUB_REF_NAME}.tar.gz" unienv.mcpb > SHA256SUMS)
      - name: Render Homebrew formula
        run: |
          TAR_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA256="$(curl -fsSL "$TAR_URL" | sha256sum | awk '{print $1}')"
          sed -e "s|url ".*"|url "${TAR_URL}"|" \
              -e "s|sha256 ".*"|sha256 "${SHA256}"|" \
              Formula/unienv.rb > dist/unienv.rb
      - name: Attach release assets, SHA256SUMS, and Formula to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "dist/unienv-ai-${GITHUB_REF_NAME}.tar.gz" dist/unienv.mcpb dist/SHA256SUMS dist/unienv.rb --clobber \
            || gh release create "$GITHUB_REF_NAME" "dist/unienv-ai-${GITHUB_REF_NAME}.tar.gz" dist/unienv.mcpb dist/SHA256SUMS dist/unienv.rb --generate-notes
      - name: Update Homebrew tap (when HOMEBREW_TAP_TOKEN is configured)
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rupeshbharambe24/homebrew-unienv.git" /tmp/homebrew-unienv
          mkdir -p /tmp/homebrew-unienv/Formula
          cp dist/unienv.rb /tmp/homebrew-unienv/Formula/unienv.rb
          cd /tmp/homebrew-unienv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/unienv.rb
          git diff --cached --quiet || (git commit -m "unienv ${GITHUB_REF_NAME}" && git push origin HEAD)

  docker:
    needs: mcpb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rupeshbharambe24/unienv:${{ github.ref_name }}
            ghcr.io/rupeshbharambe24/unienv:latest

  devcontainer-feature:
    needs: mcpb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish Dev Container Feature
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./.devcontainer"
          namespace: "rupeshbharambe24/unienv-features"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
